name: OpenStack Crypto CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C Asymmetric Cryptography App
        run: |
          ls -la
          if [ -d "c" ]; then cd c && gcc *.c -o crypto_c && ./crypto_c || true; fi

      - name: Test Python Asymmetric Cryptography App
        run: |
          if [ -d "python" ]; then cd python && ls -la; fi
          python3 --version

      - name: Verify OpenStack Deployment Environment
        run: |
          echo "Deploying verified build to OpenStack asymmetric-project..."
          source ~/devstack/openrc admin asymmetric-project
          openstack server list
          openstack volume list
